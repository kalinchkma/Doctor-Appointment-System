worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  server_tokens off;

  # Knowledge PDFs and media uploads (Go ingest also caps at 20 MiB).
  client_max_body_size 32m;

  # Chat can wait on a cold Ollama load.
  proxy_connect_timeout 10s;
  proxy_send_timeout 180s;
  proxy_read_timeout 180s;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream payload_cms {
    server cms:3000;
  }

  log_format main '$remote_addr $request $status $request_time s';
  access_log /var/log/nginx/access.log main;

  server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Go RAG and Payload-to-Go proxy stay off the public internet (ADR-006).
    location ^~ /api/internal/ {
      deny all;
      return 404;
    }

    location = /healthz {
      proxy_pass http://payload_cms/api/access;
      proxy_set_header Host $host;
      proxy_connect_timeout 3s;
      proxy_read_timeout 5s;
    }

    location /api/chat {
      proxy_pass http://payload_cms;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port $server_port;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Origin $http_origin;
      proxy_set_header Authorization $http_authorization;
      proxy_buffering off;
      proxy_read_timeout 180s;
    }

    location / {
      proxy_pass http://payload_cms;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port $server_port;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Origin $http_origin;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Authorization $http_authorization;
      proxy_cache_bypass $http_upgrade;
    }
  }
}
