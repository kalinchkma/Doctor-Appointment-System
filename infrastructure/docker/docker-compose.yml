services:
  # One MongoDB instance, two logical databases (ADR-003, ADR-004):
  #   doctor_app  - Payload CMS application data
  #   rag_vectors - knowledge chunks and embeddings, written only by the Go service
  #
  # The Atlas Local image is used rather than mongo:8 for two reasons. It runs as a
  # single-node replica set, which is what makes MongoDB transactions available to the
  # booking flow, and it bundles Atlas Search, which is what makes $vectorSearch work.
  mongodb:
    image: mongodb/mongodb-atlas-local:8.0
    # Atlas Local names its replica set after the container hostname and advertises
    # "<hostname>:27017" to clients. Pinning the hostname therefore gives a stable set
    # name of "mongodb" that also resolves inside the Compose network, which is what lets
    # the connection strings use ?replicaSet=mongodb. Payload's mongoose adapter only
    # enables transactions when the client was configured with an explicit replicaSet.
    hostname: mongodb
    environment:
      MONGODB_INITDB_ROOT_USERNAME: ${MONGODB_USERNAME}
      MONGODB_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD}
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "mongosh --quiet --username $$MONGODB_INITDB_ROOT_USERNAME --password $$MONGODB_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval 'db.runCommand({ ping: 1 }).ok'",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  cms:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.cms
    environment:
      NODE_ENV: production
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      PAYLOAD_DATABASE_URI: ${PAYLOAD_DATABASE_URI}
      PAYLOAD_PUBLIC_URL: ${PAYLOAD_PUBLIC_URL}
      PAYLOAD_INTERNAL_URL: ${PAYLOAD_INTERNAL_URL:-http://cms:3000}
      MOBILE_ORIGIN: ${MOBILE_ORIGIN}
      RAG_SERVICE_URL: ${RAG_SERVICE_URL}
      RAG_INTERNAL_SECRET: ${RAG_INTERNAL_SECRET}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '3000:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/access').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s
    depends_on:
      mongodb:
        condition: service_healthy
      rag:
        condition: service_healthy

  # Internal only (ADR-006): no host port is published, so the RAG service is reachable
  # at http://rag:8080 from the CMS container and from nowhere else.
  rag:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.rag
    environment:
      RAG_DATABASE_URI: ${RAG_DATABASE_URI}
      RAG_DATABASE_NAME: ${RAG_DATABASE_NAME}
      RAG_INTERNAL_SECRET: ${RAG_INTERNAL_SECRET}
      RAG_MAX_CONCURRENCY: ${RAG_MAX_CONCURRENCY}
      RAG_MIN_SCORE: ${RAG_MIN_SCORE}
      RAG_STRONG_SCORE: ${RAG_STRONG_SCORE}
      RAG_MIN_CHUNKS: ${RAG_MIN_CHUNKS}
      RAG_MIN_COVERAGE: ${RAG_MIN_COVERAGE}
      PAYLOAD_INTERNAL_URL: http://cms:3000
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ../../docs/knowledge:/knowledge:ro
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      # The distroless image has no shell, so the service binary probes itself.
      test: ['CMD', '/rag', '-healthcheck']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  seed:
    profiles: ['seed']
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.cms
      target: seed
    environment:
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      PAYLOAD_DATABASE_URI: ${PAYLOAD_DATABASE_URI}
      RAG_SERVICE_URL: ${RAG_SERVICE_URL}
      RAG_INTERNAL_SECRET: ${RAG_INTERNAL_SECRET}
      PAYLOAD_INTERNAL_URL: ${PAYLOAD_INTERNAL_URL:-http://cms:3000}
    depends_on:
      mongodb:
        condition: service_healthy
      cms:
        condition: service_healthy

volumes:
  mongodb_data:
