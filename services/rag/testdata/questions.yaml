# Labelled questions against docs/knowledge/*.pdf.
# Used to calibrate RAG_MIN_SCORE / RAG_STRONG_SCORE / RAG_MIN_CHUNKS / RAG_MIN_COVERAGE.
# Prefer zero fabrications (false "sufficient") over extra cautious fallbacks.

thresholds:
  minScore: 0.62
  strongScore: 0.74
  minChunks: 2
  minCoverage: 0.25

answerable:
  - question: Does energy need to double during pregnancy?
    expect: sufficient
    notes: Explicitly answered by pregnancy-nutrition.pdf
  - question: Which micronutrients are highlighted for pregnancy nutrition?
    expect: sufficient
  - question: What does the pregnancy nutrition guide say about alcohol?
    expect: sufficient
  - question: What protein foods are listed for pregnancy?
    expect: sufficient
  - question: How many antenatal contacts did the WHO 2016 model recommend?
    expect: sufficient
    notes: Explicitly answered by prenatal-care.pdf
  - question: What is the purpose of antenatal care?
    expect: sufficient
  - question: What can maternal assessment include during prenatal care?
    expect: sufficient
  - question: What does person-centred prenatal care mean?
    expect: sufficient
  - question: At what age should complementary foods start?
    expect: sufficient
    notes: Explicitly answered by child-nutrition.pdf
  - question: How many meals per day are described for ages 6–8 months?
    expect: sufficient
  - question: What is responsive feeding?
    expect: sufficient
  - question: Which drinks are described as low nutrient value for young children?
    expect: sufficient

unanswerable:
  - question: What is the capital of France?
    expect: fallback
    reason: no_results
  - question: How do I reset a Windows password?
    expect: fallback
    reason: no_results
  - question: What exact calories does a 14-month-old need?
    expect: fallback
  - question: What exact prenatal vitamin brand should everyone take?
    expect: fallback
  - question: Can you diagnose preeclampsia from my blood pressure?
    expect: fallback

weakly_related:
  - question: What paracetamol dosage is safe in the third trimester?
    expect: fallback
    reason: low_coverage
    notes: Assignment Test 3 — pregnancy corpus, no dosage
  - question: Which antidepressant is safest in breastfeeding?
    expect: fallback
    reason: low_coverage
  - question: What antibiotic should a child take for pneumonia?
    expect: fallback
  - question: What medication cures morning sickness?
    expect: fallback
  - question: Which hospital should I deliver at in Dhaka?
    expect: fallback
